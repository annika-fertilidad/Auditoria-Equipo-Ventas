name: Acumular histórico PXI

# Cada vez que subes datos.xlsx (el export diario de Atom), este workflow
# fusiona las filas nuevas dentro de datos_historico.csv y lo vuelve a commitear.
# El commit solo toca datos_historico.csv, así que NO vuelve a dispararse (loop seguro).

on:
  push:
    paths:
      - "datos.xlsx"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install openpyxl
      # Usa la fecha de la corrida del Action como fecha del export, para
      # resolver "hoy/ayer" a fecha absoluta antes de fusionar.
      - run: |
          python scripts/merge_history.py --export-date "$(date -u +%F)"
      - name: Commit histórico actualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add datos_historico.csv
          if git diff --staged --quiet; then
            echo "Sin cambios en el histórico."
          else
            git commit -m "chore: acumula histórico PXI [skip ci]"
            git push
          fi
